[project]
name = "mcyqqs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litemapy>=0.11.0b0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "ortools>=9.15.6755",
